<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Quality Check Record</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body>

<script src="js/app.js"></script>

<script>
function initQualityCheckPage() {
  if (!requireLogin()) return;

  const db = getDB();
  const requestId = new URLSearchParams(location.search).get("requestId");

  const request = db.recoveryRequests.find(
    r => r.id === requestId
  );

  if (!request) {
    layoutWithNav(
      `<div class="alert alert-danger">Recovery request not found.</div>`,
      "Quality Check",
      serviceNav()
    );
    return;
  }

  layoutWithNav(
    `
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <span class="small text-uppercase text-secondary">
                Service Team
              </span>
              <h2>Create Quality Check Record</h2>
            </div>

            <a
              href="service-request.html?requestId=${encodeURIComponent(request.id)}"
              class="btn btn-outline-dark"
            >
              Back
            </a>
          </div>

          <div class="alert alert-light border">
            <strong>Product:</strong> ${esc(request.productName)}<br>
            <strong>Request ID:</strong> ${esc(request.id)}
          </div>

          <form id="qualityCheckForm">
            <div class="mb-3">
              <label class="form-label">Quality Check Result</label>
              <select id="qualityResult" class="form-select" required>
                <option value="">Select result</option>
                <option value="Passed">Passed</option>
                <option value="Failed">Failed</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Functionality Verification</label>
              <textarea
                id="qualityFunctionality"
                class="form-control"
                rows="3"
                placeholder="Describe the final functionality test"
                required
              ></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Final Remarks</label>
              <textarea
                id="qualityRemarks"
                class="form-control"
                rows="3"
                placeholder="Add final quality verification remarks"
                required
              ></textarea>
            </div>

            <button class="btn btn-dark">
              Save Quality Check Record
            </button>
          </form>

          <div id="qualityMsg" class="mt-3"></div>
        </div>
      </div>
    </div>
    `,
    "Create Quality Check Record",
    serviceNav()
  );

  document
    .getElementById("qualityCheckForm")
    .addEventListener("submit", e => {
      e.preventDefault();

      const form = e.target;

      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }

      const result = document.getElementById("qualityResult").value;

      db.qualityChecks.push({
        id: uid("QC-"),
        requestId: request.id,
        result,
        functionality:
          document.getElementById("qualityFunctionality").value,
        remarks:
          document.getElementById("qualityRemarks").value,
        createdAt: new Date().toLocaleString()
      });

      request.status =
        result === "Passed" ? "Completed" : "Quality Check";

      saveDB(db);

      document.getElementById("qualityMsg").innerHTML =
        alertBox("Quality check record created successfully.");

      setTimeout(() => {
        location.href =
          `service-request.html?requestId=${encodeURIComponent(request.id)}`;
      }, 900);
    });
}

initQualityCheckPage();
</script>

</body>
</html>
