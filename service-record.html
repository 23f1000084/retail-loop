<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repair / Refurbishment Record</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>

<body>

<script src="js/app.js"></script>

<script>
function initServiceRecordPage() {
  if (!requireLogin()) return;

  const db = getDB();
  const requestId = new URLSearchParams(location.search).get("requestId");

  const request = db.recoveryRequests.find(
    r => r.id === requestId
  );

  if (!request) {
    layoutWithNav(
      `<div class="alert alert-danger">Recovery request not found.</div>`,
      "Service Record",
      serviceNav()
    );
    return;
  }

  layoutWithNav(
    `
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <span class="small text-uppercase text-secondary">
                Service Team
              </span>
              <h2>Repair / Refurbishment Record</h2>
            </div>

            <a
              href="service-request.html?requestId=${encodeURIComponent(request.id)}"
              class="btn btn-outline-dark"
            >
              Back
            </a>
          </div>

          <div class="alert alert-light border">
            <strong>Product:</strong> ${esc(request.productName)}<br>
            <strong>Request ID:</strong> ${esc(request.id)}
          </div>

          <form id="serviceRecordForm">
            <div class="mb-3">
              <label class="form-label">Service Type</label>
              <select id="serviceType" class="form-select" required>
                <option value="">Select service type</option>
                <option value="Repair">Repair</option>
                <option value="Refurbishment">Refurbishment</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Work Performed</label>
              <textarea
                id="serviceDescription"
                class="form-control"
                rows="4"
                placeholder="Describe the repair or refurbishment work"
                required
              ></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Parts Replaced or Used</label>
              <textarea
                id="partsUsed"
                class="form-control"
                rows="3"
                placeholder="List parts replaced or used"
                required
              ></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Service Status</label>
              <select id="serviceStatus" class="form-select" required>
                <option value="Completed">Completed</option>
                <option value="In Progress">In Progress</option>
              </select>
            </div>

            <button class="btn btn-dark">
              Save Service Record
            </button>
          </form>

          <div id="serviceMsg" class="mt-3"></div>
        </div>
      </div>
    </div>
    `,
    "Repair / Refurbishment Record",
    serviceNav()
  );

  document
    .getElementById("serviceRecordForm")
    .addEventListener("submit", e => {
      e.preventDefault();

      const form = e.target;

      if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
      }

      const type = document.getElementById("serviceType").value;
      const status = document.getElementById("serviceStatus").value;

      const record = {
        id: uid("SRV-"),
        requestId: request.id,
        type,
        description: document.getElementById("serviceDescription").value,
        partsUsed: document.getElementById("partsUsed").value,
        status,
        createdAt: new Date().toLocaleString()
      };

      if (type === "Repair") {
        db.repairs.push(record);
        request.status = "Repair in Progress";
      } else {
        db.refurbishments.push(record);
        request.status = "Refurbishment in Progress";
      }

      saveDB(db);

      document.getElementById("serviceMsg").innerHTML =
        alertBox("Repair/refurbishment record created successfully.");

      setTimeout(() => {
        location.href =
          `service-request.html?requestId=${encodeURIComponent(request.id)}`;
      }, 900);
    });
}

initServiceRecordPage();
</script>

</body>
</html>
